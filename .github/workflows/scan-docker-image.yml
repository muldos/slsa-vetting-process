name: Scan Docker Hub image with JFrog

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Docker Hub image to scan, e.g. library/alpine:3.20 or myuser/myimage:latest"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      DOCKER_REPO: ${{ vars.OCI_PRIVATE_REPO }}
      JF_HOST: ${{ vars.JF_HOST }}
      JF_URL: https://${{ vars.JF_HOST }}/
      JF_PROJECT: ${{ vars.JF_PROJECT_KEY }}
      IMAGE_NAME: ${{ inputs.image }}
    steps:
      - name: Install JFrog CLI with OIDC authentication
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-cli
        with:
          oidc-provider-name: davidro-github-integration
          oidc-audience: davidro-github
      - name: Authenticate Docker
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.JF_HOST }}
          username: ${{ steps.setup-cli.outputs.oidc-user }}
          password: ${{ steps.setup-cli.outputs.oidc-token }}
      - name: Pull Docker Hub image
        # we pull on purpose from docker hub to simulate a public image to vet
        run: docker pull "$IMAGE_NAME"
      - name: Scan image with JFrog CLI
        run: JFROG_CLI_LOG_LEVEL=ERROR jf docker scan --sca --without-contextual-analysis --fail=false --min-severity='HIGH' "$IMAGE_NAME"
      - name: Generate VSA predicate
        run: |
          set -euo pipefail
          oci_image="${JF_HOST}/${DOCKER_REPO}/${IMAGE_NAME}"
          jq -n \
            --arg verifier "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/scan-docker-image.yml@${GITHUB_SHA}" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg resource "$oci_image" \
            --arg policy "https://github.com/${GITHUB_REPOSITORY}#docker-vetting" \
            '{
              verifier: {id: $verifier},
              timeVerified: $time,
              resourceUri: $resource,
              policy: {uri: $policy},
              verificationResult: "PASSED",
              verifiedLevels: ["PUBLIC_GATE"],
              slsaVersion: "1.0"
            }' > vsa.json
          echo "OCI_IMAGE=${oci_image}" >> "$GITHUB_ENV"
      - name: tag, publish and attach vetted attestation
        run: |
          docker tag "$IMAGE_NAME" "$OCI_IMAGE"
          # Attach the VSA to the image pushed to the OCI repo
          cosign attest --yes \
            --predicate ./vsa.json \
            --type https://slsa.dev/verification_summary/v1 \
            "$OCI_IMAGE"